name: Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip rpm \
            libegl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install PySide6
          .venv/bin/python -m unittest discover -s tests -q

      - name: Build .deb
        run: ./packaging/debian/build-deb.sh

      - name: Build .rpm
        run: ./packaging/rpm/build-rpm.sh

      - name: Build AppImage
        run: ./packaging/appimage/build-appimage.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.deb dist/*.rpm dist/*.AppImage)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no packages in dist/" >&2
            exit 1
          fi
          sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            notes="Enigmars Utils ${tag} (${sha})."
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" --clobber
            else
              gh release create "$tag" "${files[@]}" \
                --title "$tag" \
                --notes "$notes"
            fi
          else
            notes="Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}."
            if gh release view latest >/dev/null 2>&1; then
              gh release delete latest --yes --cleanup-tag
            fi
            gh release create latest "${files[@]}" \
              --title "Latest (${sha})" \
              --notes "$notes" \
              --latest
          fi
